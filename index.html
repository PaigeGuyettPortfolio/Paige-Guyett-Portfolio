<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Farmhouse Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap">
<style>
/* Layout concept: the photograph is the page. Interface floats in the corners, panels arrive like a page laid over it. */
:root{
  --ivory:#F6F0E4; --paper:#FBF7EE; --limestone:#E4D8C3; --oak:#A98559;
  --espresso:#2C2118; --charcoal:#413C35; --olive:#66664A; --rule:#D6C9B2;
  --serif:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'DM Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.15,1);
  --gx:max(24px,env(safe-area-inset-left,0px)); --gr:max(24px,env(safe-area-inset-right,0px));
}
html,body,#root{height:100%}
body{background:var(--espresso);color:var(--charcoal);font:400 16px/1.6 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--oak);outline-offset:3px}
h1,h2,h3,h4,p,dl,dd,ol,ul,figure,blockquote{margin:0;padding:0}
ol,ul{list-style:none}

.stage{position:fixed;inset:0;overflow:hidden;touch-action:none;opacity:0;transition:opacity 1.2s ease;background:var(--espresso)}
.stage.ready{opacity:1}
.frame{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scrim-b{position:absolute;left:0;right:0;bottom:0;height:24%;pointer-events:none;background:linear-gradient(to top,rgba(28,20,13,.5),rgba(28,20,13,.16) 55%,transparent)}

/* hotspots */
.hot{position:absolute;inset:0;overflow:hidden}
.poly{position:absolute;left:0;top:0;transform-origin:0 0;overflow:visible}
.poly polygon{fill:transparent;cursor:pointer;pointer-events:all}
.poly.show polygon{stroke:#F6F0E4;stroke-width:1.2;stroke-dasharray:5 4;fill:rgba(246,240,228,.09)}
.markers{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:auto;display:grid;place-items:center;will-change:transform}
.mk i{display:block;width:7px;height:7px;border-radius:50%;background:rgba(251,247,238,.92);box-shadow:0 0 0 1px rgba(44,33,24,.25),0 0 10px rgba(44,33,24,.25);position:relative;transition:transform .5s var(--ease)}
.mk i::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(251,247,238,.65);animation:breath 5.5s ease-in-out infinite}
.mk.exit i{background:transparent;box-shadow:none;border:1px solid rgba(251,247,238,.95);width:9px;height:9px;transform:rotate(45deg);border-radius:0;border-left:0;border-bottom:0}
.mk.exit i::after{border-radius:50%;inset:-9px;transform:rotate(-45deg)}
.mk span{position:absolute;left:50%;bottom:calc(100% - 6px);transform:translate(-50%,6px);white-space:nowrap;padding:5px 12px 4px;background:rgba(251,247,238,.95);color:var(--espresso);font:400 19px/1.15 var(--serif);opacity:0;pointer-events:none;transition:opacity .35s ease,transform .5s var(--ease)}
.mk.on span,.mk:focus-visible span{opacity:1;transform:translate(-50%,0)}
.mk.on i{transform:scale(1.25)}
.mk.exit.on i{transform:rotate(45deg) scale(1.25)}
@keyframes breath{0%,100%{opacity:.1;transform:scale(.72)}50%{opacity:.75;transform:scale(1)}}

/* chrome */
.chrome{position:fixed;inset:0;pointer-events:none;color:var(--paper);opacity:0;transition:opacity .9s ease}
.chrome.on{opacity:1}
.chrome:not(.on) *{pointer-events:none!important}
.chrome button{pointer-events:auto}
.brand{position:absolute;top:max(22px,env(safe-area-inset-top,0px));left:var(--gx);color:var(--paper);font-size:12px;letter-spacing:.14em;text-transform:uppercase;line-height:1.5;display:grid;text-shadow:0 1px 10px rgba(32,23,15,.6)}
.brand::before{content:"";position:absolute;z-index:-1;left:-140px;top:-120px;width:560px;height:280px;background:radial-gradient(closest-side,rgba(32,23,15,.58),rgba(32,23,15,.3) 55%,transparent)}
.brand strong{font:400 21px/1.15 var(--serif);letter-spacing:.02em;text-transform:none}
.welcome{position:absolute;top:calc(var(--fy,0px) + clamp(26px,5.4vh,70px));left:var(--fx,0px);width:var(--fw,100%);box-sizing:border-box;padding:0 96px;text-align:center;color:var(--espresso);opacity:0;transform:translateY(10px);transition:opacity 2.2s ease,transform 2.8s var(--ease)}
.welcome.in{opacity:1;transform:none}
.welcome h1{font:400 clamp(24px,3.1vw,50px)/1.1 var(--serif);letter-spacing:.17em;text-transform:uppercase;text-wrap:balance}
.welcome p{font:italic 400 clamp(20px,2vw,30px)/1.3 var(--serif);margin-top:.35em}
.caption{position:absolute;left:var(--gx);bottom:max(24px,env(safe-area-inset-bottom,0px));max-width:min(420px,62vw);animation:cap 1.4s var(--ease) both;text-shadow:0 1px 14px rgba(32,23,15,.45)}
.caption h2{font:400 clamp(30px,3vw,44px)/1.08 var(--serif)}
.caption p{font-size:15.5px;line-height:1.5;margin-top:6px}
@keyframes cap{from{opacity:0;transform:translateY(10px)}}
.room{margin-top:10px;position:relative;display:flex;gap:2px 20px;flex-wrap:wrap}
.link{font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 0;background:linear-gradient(currentColor,currentColor) 0 calc(100% - 3px)/100% 1px no-repeat;text-shadow:inherit}
.room-list{position:absolute;bottom:calc(100% + 8px);left:0;background:var(--paper);color:var(--espresso);padding:8px 0;min-width:270px;text-shadow:none;box-shadow:0 18px 50px rgba(32,23,15,.28);animation:cap .45s var(--ease) both}
.room-list button{display:block;width:100%;text-align:left;padding:8px 20px;font:400 20px/1.15 var(--serif)}
.room-list button:hover{background:var(--limestone)}
.prog{position:absolute;right:var(--gr);bottom:max(26px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;text-shadow:0 1px 10px rgba(32,23,15,.5)}
.count{font:400 19px/1 var(--serif);font-variant-numeric:lining-nums}
.count em{font-style:normal;opacity:.7}
.prog ol{display:flex}
.prog li button{position:relative;display:block;padding:18px 3px}
.prog li i{display:block;width:clamp(16px,2vw,28px);height:1.5px;background:rgba(251,247,238,.42);transition:background .4s,transform .4s}
.prog li .past i{background:var(--paper)}
.prog li button:hover i{transform:scaleY(2.2);background:var(--paper)}
.prog li span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:400 18px/1 var(--serif);white-space:nowrap;opacity:0;transition:opacity .25s}
.prog li button:hover span,.prog li button:focus-visible span{opacity:1}
.edit-t{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.82;padding:10px 0}
.editbar{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--espresso);color:var(--paper);font-size:13px;padding:7px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;z-index:60;max-width:calc(100vw - 32px);overflow:auto;max-height:40vh}
.editbar button{text-decoration:underline;text-underline-offset:3px}
.copied{flex-basis:100%;white-space:pre-wrap}
.editable{outline:1px dashed var(--oak);outline-offset:3px;cursor:text}

/* page panel */
.scrim{position:fixed;inset:0;z-index:30;background:linear-gradient(90deg,rgba(32,23,15,.04),rgba(32,23,15,.34));animation:fade .7s ease both}
@keyframes fade{from{opacity:0}}
.page{position:absolute;top:0;right:0;bottom:0;width:min(640px,50vw);background:var(--paper);color:var(--charcoal);overflow-y:auto;overscroll-behavior:contain;box-shadow:-30px 0 90px rgba(32,23,15,.28);animation:page 1s var(--ease) both}
@keyframes page{from{transform:translateX(7%);opacity:0}}
.close{position:sticky;float:right;top:14px;margin:14px 16px -60px 0;z-index:3;display:inline-flex;align-items:center;gap:10px;padding:8px 13px;background:rgba(251,247,238,.93);color:var(--espresso);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.close:hover{background:var(--limestone)}
.fig{position:relative}
.fig img{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--olive);margin-top:8px}
.crop{width:100%;background-repeat:no-repeat}
.lead{animation:lead 1.8s var(--ease) both}
@keyframes lead{from{clip-path:inset(0 0 16% 0);opacity:.2}to{clip-path:inset(0)}}
.page-body{padding:clamp(30px,4.4vw,60px);padding-bottom:72px;display:grid;gap:18px}
.portrait{width:58%}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive)}
.page h2{font:400 clamp(38px,4.3vw,62px)/1.02 var(--serif);color:var(--espresso);text-wrap:balance}
.lede{font:italic 400 clamp(21px,1.9vw,26px)/1.3 var(--serif);color:var(--espresso)}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 32px;margin-top:14px;padding-top:24px;border-top:1px solid var(--rule)}
.block dt,.details dt{font:500 13px/1.4 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--espresso);margin-bottom:6px}
.block dd{font-size:16px;font-weight:400;line-height:1.6}
.block.solo{margin:26px 0;padding-top:22px;border-top:1px solid var(--rule)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:8px}
.card-name{font:400 30px/1.1 var(--serif);color:var(--espresso);margin-bottom:6px}
.cards p{font-size:16px;font-weight:400}
.details{display:grid;gap:14px;border-top:1px solid var(--rule);padding-top:22px;margin-top:8px}
.details>div{display:grid;grid-template-columns:120px minmax(0,1fr);align-items:baseline;gap:12px}
.details dt{margin:0}
.details dd{font:400 21px/1.25 var(--serif);color:var(--espresso);overflow-wrap:anywhere}
.text-btn{font:400 24px/1.2 var(--serif);color:var(--espresso);border-bottom:1px solid var(--oak);padding-bottom:3px}
.text-btn:hover{color:var(--oak)}
.r1,.r2,.r3,.r4{animation:rise 1.1s var(--ease) both}
.r1{animation-delay:.2s}.r2{animation-delay:.28s}.r3{animation-delay:.38s}.r4{animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.slot{background:#EFE7D7;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.slot::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - .5px),var(--rule) calc(50% - .5px),var(--rule) calc(50% + .5px),transparent calc(50% + .5px))}
.slot span{position:relative;z-index:1;background:#EFE7D7;padding:4px 12px;font:400 14px/1.35 var(--sans);color:var(--olive);text-align:center}
.slot i{position:absolute;width:14px;height:14px;z-index:1;border:solid var(--oak);border-width:0}
.slot .tl{top:10px;left:10px;border-top-width:1px;border-left-width:1px}
.slot .br{bottom:10px;right:10px;border-bottom-width:1px;border-right-width:1px}

/* side panels for the room stories, and the caption introduction */
.page.slim{width:min(540px,44vw)}
.page.slim h2{font-size:clamp(38px,3.5vw,54px)}
.page-text{display:grid;gap:14px;margin-top:8px}
.page-text p{font-size:17px;line-height:1.7}
.uploads{margin-top:18px}
.steps{display:grid;gap:38px;margin-top:10px}
.step-num{display:block;font:400 18px/1 var(--serif);color:var(--oak);font-variant-numeric:lining-nums}
.step h3{font:400 30px/1.15 var(--serif);color:var(--espresso);margin:6px 0 8px}
.step p{font-size:17px;line-height:1.7;margin-bottom:16px}
.scrim.out{animation:fadeout .46s ease both}
.scrim.out .page{animation:pageout .46s cubic-bezier(.5,0,.8,.4) both}
@keyframes fadeout{to{opacity:0}}
@keyframes pageout{to{transform:translateX(5%);opacity:0}}
.caption .instruction{font:italic 400 21px/1.25 var(--serif);margin-top:9px}
.welcome .enter{margin-top:14px}
.welcome p{max-width:36em;margin-left:auto;margin-right:auto;text-wrap:balance}
.caption .intro{margin-top:9px;animation:cap .7s var(--ease) both}
.caption.rich::before{content:"";position:absolute;z-index:-1;inset:-90px -190px -70px -150px;pointer-events:none;background:radial-gradient(closest-side,rgba(32,23,15,.66),rgba(32,23,15,.5) 58%,transparent)}
.count,.edit-t{white-space:nowrap}

/* project folio */
.folio{position:fixed;inset:0;z-index:40;background:var(--paper);animation:folio 1.1s var(--ease) both}
@keyframes folio{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
.folio>.close{position:fixed;top:14px;right:var(--gr);margin:0;float:none}
.folio-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain}
.folio-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);min-height:min(100%,780px);align-items:end}
.hero-img,.hero-img .crop{height:100%;max-height:100vh}
.hero-img .crop{aspect-ratio:auto!important;background-size:cover!important;min-height:58vh}
.folio-title{padding:clamp(28px,4vw,64px) clamp(24px,4vw,64px);display:grid;gap:14px}
.folio-title h2{font:400 clamp(46px,5.8vw,92px)/.96 var(--serif);color:var(--espresso);text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:12px 34px;border-top:1px solid var(--rule);padding-top:16px;margin-top:6px}
.facts dt{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--olive)}
.facts dd{font:400 20px/1.2 var(--serif);color:var(--espresso)}
.folio-grid{display:grid;grid-template-columns:190px minmax(0,1fr);gap:clamp(20px,4vw,72px);padding:clamp(40px,6vw,96px) clamp(24px,4vw,64px)}
.toc{position:sticky;top:76px;align-self:start;display:grid;justify-items:start;gap:3px}
.toc button{font:400 19px/1.3 var(--serif);color:var(--olive);padding:2px 0}
.toc button:hover{color:var(--espresso)}
.folio-main{display:grid;gap:clamp(60px,8vw,128px);max-width:1120px;min-width:0}
.spread{scroll-margin-top:76px;display:grid;gap:22px}
.sec{font:500 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--olive);border-top:1px solid var(--rule);padding-top:14px}
.spread.text>p{max-width:62ch;font-size:17px;font-weight:400;line-height:1.7}
.spread.text>p.big{font:400 clamp(25px,2.6vw,38px)/1.25 var(--serif);color:var(--espresso);max-width:32em}
blockquote{font:italic 400 clamp(36px,4.8vw,72px)/1.05 var(--serif);color:var(--espresso);text-wrap:balance;max-width:17em}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.6vw,24px)}
.figs .wide{grid-column:1/-1}
.figs .wide.slot{aspect-ratio:16/8}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:20px}
.chip{aspect-ratio:3/4;margin-bottom:10px}
.swatch h4{font:400 22px/1.1 var(--serif);color:var(--espresso)}
.swatch p{font-size:15px;font-weight:400}
.process{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:26px;counter-reset:s}
.process li{counter-increment:s;border-left:1px solid var(--rule);padding-left:16px}
.process li::before{content:counter(s);font:400 34px/1 var(--serif);color:var(--oak)}
.process h4{font:400 24px/1.2 var(--serif);color:var(--espresso);margin-top:6px}
.process p{font-size:16px;font-weight:400}
.next-proj{display:grid;gap:4px;text-align:left;border-top:1px solid var(--espresso);padding-top:18px}
.np{font:400 clamp(36px,5vw,76px)/1 var(--serif);color:var(--espresso)}
.next-proj:hover .np{color:var(--oak)}

/* loader */
.loader{position:fixed;inset:0;z-index:80;background:var(--espresso);color:var(--limestone);display:grid;place-content:center;justify-items:center;gap:16px;transition:opacity 1.5s ease .1s,visibility 0s 1.7s}
.loader.done{opacity:0;visibility:hidden}
.l-name{font:400 30px/1 var(--serif)}
.loader i{display:block;width:90px;height:1px;background:var(--oak);transform-origin:left;animation:load 1.6s ease-in-out infinite alternate}
@keyframes load{from{transform:scaleX(.08)}to{transform:scaleX(1)}}

@media (max-width:820px){
  :root{--gx:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
  .page{width:100%}
  .page.slim{width:100%;top:9vh;animation-name:sheet}
  .scrim.out .page.slim{animation-name:sheetout}
  .blocks,.cards{grid-template-columns:minmax(0,1fr)}
  .welcome{padding:0 16px;top:clamp(78px,11vh,120px)}
  .welcome h1{letter-spacing:.12em}
  .caption{bottom:64px;max-width:calc(100vw - 32px)}
  .caption.top{bottom:auto;top:max(24px,env(safe-area-inset-top,0px))}
  .caption.rich::before{inset:-70px -16px -64px -16px;background:linear-gradient(to top,rgba(32,23,15,.72) 72%,transparent)}
  .caption.top.rich::before{inset:-120px -16px -70px -16px;background:linear-gradient(to bottom,rgba(32,23,15,.66) 60%,transparent)}
  .caption.top .room-list{bottom:auto;top:calc(100% + 8px)}
  .prog{left:var(--gx);right:var(--gr);bottom:max(10px,env(safe-area-inset-bottom,0px));justify-content:space-between}
  .prog{gap:8px}
  .prog li i{width:clamp(11px,3.4vw,30px)}
  .prog li span{display:none}
  .scrim-b{height:26%}
  .folio-hero{grid-template-columns:minmax(0,1fr)}
  .hero-img .crop{min-height:44vh}
  .folio-grid{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
  .figs{grid-template-columns:minmax(0,1fr)}
  .details>div{grid-template-columns:minmax(0,1fr);gap:0}
  .folio>.close{background:var(--paper)}
}
@keyframes sheet{from{transform:translateY(7%);opacity:0}}
@keyframes sheetout{to{transform:translateY(5%);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
  .mk i::after{animation:none;opacity:.5}
}

/* full-screen popups */
.scrim{background:var(--paper)}
.page,.page.slim{top:0;left:0;right:0;bottom:0;width:100%;box-shadow:none;animation:pagein .8s var(--ease) both}
.scrim.out .page,.scrim.out .page.slim{animation:pagefade .46s ease both}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}}
@keyframes pagefade{to{opacity:0}}
.page h2,.page.slim h2{font-size:clamp(42px,4.6vw,72px)}
.close{right:0}
.spread-page{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,5.5vw,96px);max-width:1520px;min-height:100%;box-sizing:border-box;margin:0 auto;padding:clamp(66px,9vh,110px) clamp(28px,5.5vw,96px);align-items:start}
.spread-page.single{align-items:center}
.copy{display:grid;gap:18px;align-content:start;min-width:0}
.page-text{gap:16px}
.details dd{font-variant-numeric:lining-nums}
.details a{color:inherit;text-decoration:underline;text-decoration-color:var(--oak);text-underline-offset:4px}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,1.8vw,28px);min-width:0}
.gallery .wide{grid-column:1/-1}
.gallery.one .card{grid-column:1/-1;width:min(100%,calc((100vh - 180px) * var(--r)));justify-self:center}
.page-steps{display:grid;gap:clamp(40px,6vh,72px);max-width:1320px;box-sizing:border-box;margin:0 auto;padding:clamp(66px,9vh,110px) clamp(28px,5.5vw,96px)}
.page-steps .steps{gap:clamp(48px,7vh,96px);margin:0}
.step{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5.5vw,96px);align-items:center}
.step .card{width:min(100%,calc((100vh - 180px) * var(--r)));justify-self:center}
.step-text p{margin:0}

/* image cards */
.card{min-width:0}
.flip{display:block;width:100%;perspective:1500px;cursor:pointer}
.card.on .flip{cursor:default}
.flip-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.05s var(--ease)}
.card:not(.on) .flip:hover .flip-in{transform:rotateY(7deg)}
.card.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:block;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{display:grid;place-content:center;justify-items:center;gap:8px;background:var(--limestone);color:var(--espresso);box-shadow:inset 0 0 0 1px rgba(44,33,24,.08)}
.face.back::after{content:"";position:absolute;inset:12px;border:1px solid rgba(169,133,89,.55);pointer-events:none}
.mono{font:400 clamp(30px,3.4vw,50px)/1 var(--serif);letter-spacing:.08em}
.hint{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive)}
.face.front{transform:rotateY(180deg);background:#EFE7D7}
.front .fig,.front .fig img,.front .crop{display:block;width:100%;height:100%}
.front .fig img{object-fit:cover}
.front .crop,.front .fig.slot{aspect-ratio:auto!important}
.card-cap{font-size:14px;color:var(--olive);margin-top:9px;animation:cap .7s var(--ease) both}
.welcome .enter{pointer-events:auto;color:var(--espresso)}

@media (min-width:821px) and (min-height:700px){.spread-page:not(.single) .copy{position:sticky;top:clamp(66px,9vh,110px)}}
@media (max-width:820px){
  .page.slim{top:0}
  .spread-page,.step{grid-template-columns:minmax(0,1fr)}
  .spread-page,.page-steps{padding:70px 20px 48px}
  .spread-page.single{align-items:start}
  .gallery{grid-template-columns:minmax(0,1fr)}
  .gallery.one .card,.step .card{width:100%}
  .page h2,.page.slim h2{font-size:42px}
  .scrim.out .page,.scrim.out .page.slim{animation-name:pagefade}
  .page,.page.slim{animation-name:pagein}
}

/* contact link, every room */
.contact-corner{position:absolute;top:max(22px,env(safe-area-inset-top,0px));right:var(--gr);padding:8px 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper);text-shadow:0 1px 10px rgba(32,23,15,.75),0 0 3px rgba(32,23,15,.45);background:linear-gradient(currentColor,currentColor) 0 calc(100% - 4px)/100% 1px no-repeat}

/* envelope card backs */
.face.back{display:block;background:#EDE3CF;box-shadow:inset 0 0 0 1px rgba(90,70,44,.14)}
.face.back::after{display:none}
.env{position:absolute;inset:0;width:100%;height:100%;display:block}
.env-l,.env-r{fill:#E6DAC2}
.env-b{fill:#EDE3CF;stroke:rgba(110,86,54,.2);stroke-width:.25;vector-effect:non-scaling-stroke}
.env-f{fill:#F2E9D8;stroke:rgba(110,86,54,.3);stroke-width:1;vector-effect:non-scaling-stroke;filter:drop-shadow(0 1px 1px rgba(70,50,28,.2))}
.seal{position:absolute;left:50%;top:58%;width:clamp(52px,5.4vw,76px);aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:47% 53% 50% 50%/52% 48% 52% 48%;background:radial-gradient(circle at 36% 30%,#B9925A,#8F6A38 62%,#6F4F27);box-shadow:0 2px 5px rgba(60,40,20,.38),inset 0 0 0 4px rgba(255,235,195,.14);color:#F6EAD3;font:500 clamp(17px,1.8vw,25px)/1 var(--serif);letter-spacing:.05em}
.face.back .hint{position:absolute;left:0;right:0;bottom:clamp(10px,7%,28px);text-align:center;color:#6B5A3F}

/* design process: image left, writing right */
@media (min-width:821px){
  .step{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
  .step .card{order:-1}
}

/* popup interactions */
.card-stage{position:relative;transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.card.on .card-stage:hover{box-shadow:0 18px 44px rgba(44,33,24,.2)}
.card:not(.on) .card-stage:hover{box-shadow:0 14px 34px rgba(44,33,24,.16)}
.flip.viewable{cursor:zoom-in}
.expand{position:absolute;right:10px;bottom:10px;width:30px;height:30px;display:grid;place-items:center;background:rgba(251,247,238,.9);color:var(--espresso);opacity:.82;transition:opacity .4s}
.flip.viewable:hover .expand,.flip.viewable:focus-visible .expand{opacity:1}
.card.fx-tilt .card-stage{transform:perspective(1100px) rotateY(calc(var(--px,0) * 5deg)) rotateX(calc(var(--py,0) * -4deg))}
.card.fx-pan .front .crop{transform:scale(1.07) translate(calc(var(--px,0) * -22px),calc(var(--py,0) * -14px));transition:transform .9s var(--ease)}
.rv.wait{opacity:0;transform:translateY(22px);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.rv.wait.in{opacity:1;transform:none}
.stagger>div{animation:rise .9s var(--ease) both}
.stagger>div:nth-child(1){animation-delay:.42s}.stagger>div:nth-child(2){animation-delay:.5s}.stagger>div:nth-child(3){animation-delay:.58s}.stagger>div:nth-child(4){animation-delay:.66s}.stagger>div:nth-child(5){animation-delay:.74s}

/* discovery points on photographs and material boards */
.notes{position:absolute;inset:0;pointer-events:none}
.note{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;display:grid;place-items:center;pointer-events:auto;cursor:pointer;z-index:1}
.note:hover,.note:focus-visible,.note.open{z-index:3}
.note i{display:block;width:9px;height:9px;border-radius:50%;background:rgba(251,247,238,.95);box-shadow:0 0 0 1px rgba(44,33,24,.3),0 0 0 6px rgba(251,247,238,.26);transition:transform .45s var(--ease)}
.note:hover i,.note:focus-visible i,.note.open i{transform:scale(1.3)}
.note-tag{position:absolute;left:50%;bottom:calc(100% + 2px);transform:translate(-50%,6px);display:grid;gap:1px;padding:7px 12px 8px;background:var(--paper);color:var(--espresso);text-align:center;white-space:nowrap;box-shadow:0 10px 26px rgba(44,33,24,.24);opacity:0;pointer-events:none;transition:opacity .35s ease,transform .5s var(--ease)}
.note.flip-l .note-tag{left:auto;right:-6px;transform:translateY(6px);text-align:right}
.note:not(.flip-l) .note-tag{min-width:max-content}
.note:hover .note-tag,.note:focus-visible .note-tag,.note.open .note-tag{opacity:1;transform:translate(-50%,0)}
.note.flip-l:hover .note-tag,.note.flip-l:focus-visible .note-tag,.note.flip-l.open .note-tag{transform:none}
.note-tag strong{font:400 19px/1.15 var(--serif)}
.note-tag em{font:italic 400 16px/1.2 var(--serif);color:var(--olive)}

.note.flip-r .note-tag{left:-6px;transform:translateY(6px);text-align:left}
.note.flip-r:hover .note-tag,.note.flip-r:focus-visible .note-tag,.note.flip-r.open .note-tag{transform:none}
.gallery .g-item{min-width:0}
.gallery .g-item.wide,.gallery.one .g-item{grid-column:1/-1}
.gallery.one .g-item{display:grid;justify-items:center}
.gallery.one .card{width:min(100%,calc((100vh - 180px) * var(--r)))}

/* about: the passage under the reader comes forward */
.spot p{transition:opacity .5s ease}
@media (hover:hover){.spot:hover p:not(:hover){opacity:.45}}

/* biophilic: writing grows along a stem */
.stem{position:relative;padding-left:30px;gap:20px}
.stem::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--oak);transform-origin:top;animation:stem 1.6s var(--ease) .45s both}
.stem p{position:relative;transition:color .4s}
.stem p::before{content:"";position:absolute;left:-30px;top:7px;width:11px;height:11px;background:var(--olive);border-radius:0 100% 0 100%;transition:transform .5s var(--ease)}
.stem p:hover::before{transform:scale(1.35) rotate(-12deg)}
.stem p:hover{color:var(--espresso)}
@keyframes stem{from{transform:scaleY(0)}}

/* philosophy: one passage at a time */
.leaves{display:grid;gap:24px;margin-top:8px}
.leaf-stack{display:grid}
.leaf{grid-area:1/1;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .55s ease,transform .75s var(--ease),visibility 0s .55s}
.leaf.on{opacity:1;visibility:visible;transform:none;transition:opacity .75s ease .12s,transform .9s var(--ease) .12s,visibility 0s}
.leaf p{font-size:19px;line-height:1.65}
.leaf-nav{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:16px;border-top:1px solid var(--rule)}
.leaf-nums{display:flex;gap:6px}
.leaf-nums button{min-width:40px;min-height:40px;font:400 19px/1 var(--serif);color:var(--olive);font-variant-numeric:lining-nums;border-bottom:1px solid transparent;transition:color .3s,border-color .4s}
.leaf-nums button:hover,.leaf-nums button.on{color:var(--espresso)}
.leaf-nums button.on{border-bottom-color:var(--oak)}
.leaf-next{min-height:40px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--espresso)}

/* design process: a quiet guide along the way */
.rail{position:sticky;top:0;z-index:2;display:flex;gap:clamp(14px,3vw,44px);padding:14px 110px 12px 0;margin-bottom:calc(clamp(40px,6vh,72px) * -.5);background:linear-gradient(var(--paper) 78%,rgba(251,247,238,0))}
.rail button{display:flex;align-items:baseline;gap:8px;min-height:32px;color:var(--olive);transition:color .35s}
.rail b{font:400 18px/1 var(--serif);font-variant-numeric:lining-nums}
.rail span{font-size:14px}
.rail button:hover,.rail button.on{color:var(--espresso)}
.rail button.on b{color:var(--oak)}

/* contact */
.copy-row dd{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px}
.copy-btn{font:400 12.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--olive);padding:7px 0;transition:color .3s}
.copy-btn:hover{color:var(--espresso)}

/* immersive viewer */
.viewer{position:fixed;inset:0;z-index:90;background:#1E1610;color:var(--paper);display:grid;grid-template-rows:minmax(0,1fr) auto;animation:vin .55s ease both;touch-action:none}
.viewer.out{animation:vout .26s ease both}
@keyframes vin{from{background:rgba(30,22,16,0)}}
@keyframes vout{to{opacity:0}}
.v-area{position:relative;display:grid;place-items:center;overflow:hidden;min-height:0;cursor:default;-webkit-user-select:none;user-select:none}
.v-wrap{position:relative;box-shadow:0 34px 90px rgba(0,0,0,.5);will-change:transform}
.v-stage{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .42s var(--ease)}
.v-stage.live{transition:none}
.v-stage.zoomed{cursor:grab}
.v-stage.live.zoomed{cursor:grabbing}
.v-stage .fig,.v-stage .fig img,.v-stage .crop{display:block;width:100%;height:100%;pointer-events:none;aspect-ratio:auto!important}
.v-stage .fig img,.v-before img{-webkit-user-drag:none}
.v-before{position:absolute;inset:0;pointer-events:none}
.v-before img{display:block;width:100%;height:100%}
.v-line{position:absolute;top:0;bottom:0;width:1px;background:var(--oak);pointer-events:none}
.v-line i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--paper);box-shadow:0 2px 10px rgba(44,33,24,.35)}
.v-line i::before{content:"\2039\00a0\203A";position:absolute;inset:0;display:grid;place-items:center;color:var(--espresso);font:400 19px/1 var(--serif)}
.v-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px;padding:10px clamp(16px,3vw,44px) max(12px,env(safe-area-inset-bottom,0px));min-height:50px}
.v-info{display:flex;align-items:baseline;gap:14px;min-width:0}
.v-count{font:400 18px/1 var(--serif);font-variant-numeric:lining-nums;white-space:nowrap}
.v-cap{font-size:14px;opacity:.82;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-compare{grid-column:2;display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.06em}
.v-compare input{width:clamp(110px,18vw,240px);accent-color:var(--oak);height:30px}
.v-ctl{grid-column:3;justify-self:end;display:flex;gap:4px}
.v-ctl button{width:42px;height:42px;font:400 21px/1 var(--serif);color:var(--paper);transition:background .3s,opacity .3s}
.v-ctl button:hover:not(:disabled){background:rgba(251,247,238,.14)}
.v-ctl button:disabled{opacity:.3;cursor:default}
.viewer :focus-visible{outline-color:var(--limestone)}
.v-close{position:absolute;float:none;margin:0;top:14px;right:16px;z-index:2}

@media (max-width:820px){
  .rail{padding-right:90px;gap:8px}
  .rail span{display:none}
  .rail button{min-width:40px;min-height:40px;justify-content:center;align-items:center}
  .v-bar{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .v-compare{grid-column:1/-1;grid-row:1;justify-self:center}
  .v-ctl{grid-column:2}
}
@media (prefers-reduced-motion:reduce){
  .rv.wait{opacity:1;transform:none}
  .card.fx-tilt .card-stage{transform:none}
  .card.fx-pan .front .crop{transform:none}
  .viewer,.viewer.out{animation:none}
}

/* one slow, clean fade for every popup */
.scrim{animation:popfade 1.5s cubic-bezier(.4,0,.2,1) both;will-change:opacity}
.scrim.out{animation:popout 1s cubic-bezier(.4,0,.2,1) both}
.page,.page.slim,.scrim.out .page,.scrim.out .page.slim{animation:none}
.page .r1,.page .r2,.page .r3,.page .r4,.page .stagger>div,.page .card-cap{animation:none}
.stem::before{animation:none}
@keyframes popfade{from{opacity:0}to{opacity:1}}
@keyframes popout{from{opacity:1}to{opacity:0}}

/* images appear only where the cursor has been */
.flip{position:relative;touch-action:pan-y;perspective:none;cursor:default}
.card:not(.on) .flip:hover .flip-in,.card.on .flip-in{transform:none}
.card:not(.on) .card-stage:hover{box-shadow:none}
.flip-in{transition:none}
.face.front{transform:none}
.cover{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;box-shadow:inset 0 0 0 1px var(--rule);transition:opacity 1s ease}
.cover.fading{opacity:0}
.reveal-hint{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);pointer-events:none}
.for-touch{display:none}
@media (hover:none){.for-mouse{display:none}.for-touch{display:inline}}
.expand{z-index:1}
@media (prefers-reduced-motion:reduce){.scrim,.scrim.out{animation:none}.cover{transition:none}}
.sects{display:grid;gap:22px;margin-top:6px}
.sect h3{font:500 13px/1.4 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--espresso);margin-bottom:7px}
.sect p{font-size:16px;line-height:1.7}
.spread-page.solo{grid-template-columns:minmax(0,620px);justify-content:center;align-content:center}

/* biophilic design: words among trees and sunlight */
.page.nature .close{position:relative;z-index:4}
.bio-scene{position:sticky;top:0;left:0;height:100vh;margin-bottom:-100vh;overflow:hidden;pointer-events:none;background:linear-gradient(#F7F1DF,#FBF7EE 58%,#F1EEDB)}
.bio-sun{position:absolute;left:50%;top:-34vh;width:120vw;height:90vh;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,222,150,.72),rgba(255,226,165,.26) 55%,transparent)}
.ray{position:absolute;top:-24%;width:13vw;height:150%;background:linear-gradient(rgba(255,230,170,.5),rgba(255,235,190,.08) 70%,transparent);transform:rotate(16deg);transform-origin:top;filter:blur(20px);animation:ray 11s ease-in-out infinite alternate;will-change:opacity}
@keyframes ray{from{opacity:.32}to{opacity:.95}}
.bio-trees{position:absolute;top:0;bottom:0;width:clamp(90px,14vw,250px);opacity:.92;animation:treeIn 2.6s cubic-bezier(.2,.7,.15,1) both}
.bio-trees svg{display:block;width:100%;height:100%}
.bio-trees.left{left:0;--from:-100%}
.bio-trees.right{right:0;--from:100%;transform:scaleX(-1)}
.bio-trees.right{animation-name:treeInR}
@keyframes treeIn{from{transform:translateX(var(--from))}}
@keyframes treeInR{from{transform:translateX(var(--from)) scaleX(-1)}to{transform:scaleX(-1)}}
.bio-veil{position:absolute;left:50%;top:50%;width:min(900px,92vw);height:92vh;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(251,247,238,.92),rgba(251,247,238,.76) 62%,rgba(251,247,238,0))}
.bough{position:absolute;width:clamp(250px,37vw,620px);animation:boughIn 2.8s cubic-bezier(.2,.7,.15,1) .15s both}
.bough svg{display:block;width:100%;height:auto;overflow:visible}
.bough.tl{left:0;top:0;--bx:-46%;--by:-46%;--s:1,1}
.bough.tr{right:0;top:0;--bx:46%;--by:-46%;--s:-1,1}
.bough.bl{left:0;bottom:0;--bx:-46%;--by:46%;--s:1,-1;width:clamp(180px,25vw,430px)}
.bough.br{right:0;bottom:0;--bx:46%;--by:46%;--s:-1,-1;width:clamp(180px,25vw,430px)}
.bough{transform:scale(var(--s))}
@keyframes boughIn{from{transform:translate(var(--bx),var(--by)) scale(var(--s))}}
.sway{transform-origin:0 0;animation:sway 9s ease-in-out infinite alternate;will-change:transform}
.sway.slow{animation-duration:13s}
@keyframes sway{from{transform:rotate(-1.3deg)}to{transform:rotate(1.5deg)}}
.page.nature .spread-page{position:relative;z-index:1;align-content:center;justify-content:center;grid-template-columns:minmax(0,600px);min-height:100%}
.page.nature .copy{justify-items:center;text-align:center}
.page.nature .page-text p{font-size:17px;line-height:1.75}
@media (max-width:820px){
  .bio-trees{display:none}
  .bough{width:46vw}
  .bough.bl,.bough.br{width:30vw}
  .page.nature .spread-page{padding:150px 28px 110px}
}
@media (prefers-reduced-motion:reduce){.ray,.sway,.bough,.bio-trees{animation:none}.ray{opacity:.7}}
.card.cut .face.front{background:transparent}
.card.cut .card-stage:hover{box-shadow:none}
.v-wrap.cut{background:var(--paper)}

/* wayfinding */
.caption h2:empty{display:none}
.way-hint{font-size:15px;margin-top:6px}
.next-room{display:block;margin-top:10px;font-size:13.5px;padding:8px 0}
.mk i{width:11px;height:11px}
.mk i::after{inset:-9px;border-width:1.5px;animation:breath2 3.4s ease-in-out infinite}
.mk.exit i{width:11px;height:11px;border-width:1.5px}
.mk.exit i::after{inset:-10px}
@keyframes breath2{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.12)}}
.mk span{transform:translate(calc(-50% + var(--nx,0px)),6px)}
.mk.on span,.mk.tell span,.mk:focus-visible span{opacity:1;transform:translate(calc(-50% + var(--nx,0px)),0)}
.mk.tell i{transform:scale(1.3)}
.mk.exit.tell i{transform:rotate(45deg) scale(1.3)}
@media (prefers-reduced-motion:reduce){.mk i::after{animation:none;opacity:.75}}

/* Looking Ahead horseshoe */
.shoe-wrap{display:grid;place-items:center;min-height:min(62vh,520px)}
.shoe{position:relative;width:min(300px,62vw);display:grid;justify-items:center;perspective:900px}
.shoe-spin{width:100%;animation:shoespin 9s linear infinite;transform-style:preserve-3d;will-change:transform}
.shoe-spin svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 14px rgba(44,33,24,.18))}
.shoe-shadow{display:block;width:62%;height:16px;margin-top:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(44,33,24,.26),transparent);animation:shoeshadow 4.5s ease-in-out infinite}
@keyframes shoespin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes shoeshadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.22)}}
@media (prefers-reduced-motion:reduce){.shoe-spin,.shoe-shadow{animation:none}}</style>
